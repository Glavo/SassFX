project:
  name: sassfx
  description: Pure Java Sass compiler with CSS, JavaFX CSS, and BSS backends.
  authors:
    - Glavo
  license: MPL-2.0
  inceptionYear: 2026
  links:
    homepage: https://github.com/Glavo/SassFX
    documentation: https://github.com/Glavo/SassFX#readme

release:
  github:
    enabled: false

signing:
  pgp:
    active: RELEASE
    armored: true
    verify: false

deploy:
  maven:
    mavenCentral:
      sassfx:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        applyMavenCentralRules: true
        stagingRepositories:
          - build/staging-repository
