name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle
      - name: Verify release
        run: >-
          ./gradlew --no-daemon
          -PsassfxVersion="${GITHUB_REF_NAME#v}"
          clean check verifyReleaseVersion verifyPublishedConsumer
          --warning-mode all

  publish_maven:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle
      - name: Publish Maven artifacts
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_DEPLOY_MAVEN_MAVENCENTRAL_SASSFX_ACTIVE: RELEASE
          JRELEASER_SIGNING_ACTIVE: RELEASE
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.SIGNING_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          -PsassfxVersion="${GITHUB_REF_NAME#v}"
          jreleaserDeploy

  publish_gradle_plugin:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle
      - name: Publish Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: >-
          ./gradlew --no-daemon
          -PsassfxVersion="${GITHUB_REF_NAME#v}"
          :sassfx-gradle-plugin:publishPlugins

  release:
    needs:
      - publish_maven
      - publish_gradle_plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle
      - name: Publish GitHub release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./gradlew --no-daemon
          -PsassfxVersion="${GITHUB_REF_NAME#v}"
          jreleaserRelease
