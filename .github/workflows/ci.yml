name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle
      - name: Run tests on Unix
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon clean check --warning-mode all
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean check --warning-mode all

  delivery:
    name: Delivery verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install JavaFX 8 runtime
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"
          java-package: jdk+fx
      - name: Record JavaFX 8 home
        shell: bash
        run: echo "JAVAFX8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle
      - name: Verify documentation and published artifacts
        run: >-
          ./gradlew --no-daemon
          :sassfx-core:javadoc
          :sassfx-cli:javadoc
          :sassfx-embedded:javadoc
          :sassfx-gradle-plugin:javadoc
          verifyPublishedConsumer
          --warning-mode all
      - name: Verify JavaFX compatibility matrix
        run: >-
          ./gradlew --no-daemon
          :sassfx-core:verifyAllJavaFXCssOracles
          -PjavaFX8OracleJavaHome="$JAVAFX8_HOME"
          --warning-mode all
