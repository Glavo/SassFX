name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle
      - name: Run tests on Unix
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon clean check --warning-mode all
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean check --warning-mode all

  native-cli:
    name: Native CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          java-version: "25"
          distribution: graalvm
          github-token: ${{ github.token }}
          cache: gradle
          native-image-job-reports: "true"
      - name: Build and verify native CLI on Unix
        if: runner.os != 'Windows'
        run: >-
          ./gradlew --no-daemon
          :sassfx-cli:verifyNativeCli
          --warning-mode all
      - name: Build and verify native CLI on Windows
        if: runner.os == 'Windows'
        run: >-
          .\gradlew.bat --no-daemon
          :sassfx-cli:verifyNativeCli
          --warning-mode all

  delivery:
    name: Delivery verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install JavaFX 8 runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "8"
          java-package: jdk+fx
      - name: Record JavaFX 8 home
        shell: bash
        run: echo "JAVAFX8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle
      - name: Verify documentation and published artifacts
        run: >-
          ./gradlew --no-daemon
          :sassfx-core:javadoc
          :sassfx-cli:javadoc
          :sassfx-embedded:javadoc
          :sassfx-gradle-plugin:javadoc
          verifyPublishedConsumer
          --warning-mode all
      - name: Verify JavaFX compatibility matrix
        run: >-
          ./gradlew --no-daemon
          :sassfx-core:verifyAllJavaFXCssOracles
          -PjavaFX8OracleJavaHome="$JAVAFX8_HOME"
          --warning-mode all
